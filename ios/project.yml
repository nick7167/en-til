name: EnTil
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '18.0'
  developmentLanguage: da
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    VERSIONING_SYSTEM: apple-generic
    PRODUCT_BUNDLE_IDENTIFIER: dev.adrez.entil
    DEVELOPMENT_TEAM: JDW2B73SS5
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
targets:
  EnTil:
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    sources: [EnTil]
    info:
      path: EnTil/Info.plist
      properties:
        CFBundleDisplayName: En til?
        LSRequiresIPhoneOS: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen: {}
        UIAppFonts: [Fraunces.ttf, EnTilHeadings-Bold.ttf]
        EnTilAPIURL: $(ENTIL_API_URL)
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        'CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]': EnTil/Simulator.entitlements
        ENTIL_API_URL: https://en-til-beta.nicklas-andreasen2000.workers.dev
      configs:
        Debug:
          ENTIL_API_URL: http://127.0.0.1:8787
  EnTilTests:
    type: bundle.unit-test
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    platform: iOS
    supportedDestinations: [iOS]
    sources: [EnTilTests]
    dependencies:
      - target: EnTil
  EnTilUITests:
    type: bundle.ui-testing
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    platform: iOS
    supportedDestinations: [iOS]
    sources:
      - EnTilUITests
      - path: ../content/catalogue.draft.json
        buildPhase: resources
    dependencies:
      - target: EnTil
schemes:
  EnTil:
    build:
      targets:
        EnTil: all
    test:
      targets: [EnTilTests, EnTilUITests]
