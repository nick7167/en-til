name: EnTil
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '18.0'
  developmentLanguage: da
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    PRODUCT_BUNDLE_IDENTIFIER: dev.adrez.entil.development
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
targets:
  EnTil:
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    sources: [EnTil]
    info:
      path: EnTil/Info.plist
      properties:
        CFBundleDisplayName: En til?
        LSRequiresIPhoneOS: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen: {}
        UIAppFonts: [Fraunces.ttf]
        EnTilAPIURL: $(ENTIL_API_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        ENTIL_API_URL: https://unconfigured.invalid
      configs:
        Debug:
          ENTIL_API_URL: http://127.0.0.1:8787
  EnTilTests:
    type: bundle.unit-test
    platform: iOS
    supportedDestinations: [iOS]
    sources: [EnTilTests]
    dependencies:
      - target: EnTil
  EnTilUITests:
    type: bundle.ui-testing
    platform: iOS
    supportedDestinations: [iOS]
    sources: [EnTilUITests]
    dependencies:
      - target: EnTil
schemes:
  EnTil:
    build:
      targets:
        EnTil: all
    test:
      targets: [EnTilTests, EnTilUITests]
