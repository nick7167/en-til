name: Native checkpoint
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode and simulator availability
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Build and test native app
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild test -project ios/EnTil.xcodeproj -scheme EnTil -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' -parallel-testing-enabled NO -resultBundlePath build/EnTil.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/xcodebuild.log
      - name: Export screenshot attachments
        if: always()
        run: |
          if [ -d build/EnTil.xcresult ]; then
            xcrun xcresulttool export attachments --path build/EnTil.xcresult --output-path build/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-checkpoint
          path: |
            build/xcodebuild.log
            build/screenshots/
          retention-days: 1
          if-no-files-found: warn
